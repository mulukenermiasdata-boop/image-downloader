<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Icon comparison</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1440px; height: 620px; }
    body { font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: #fff; color: #14161a; }
    .sheet { display: flex; height: 620px; }
    .half { flex: 1; padding: 20px 24px; }
    .half.dark { background: #202124; color: #e8eaed; }
    h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .6; margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; }
    th { font-size: 11px; text-align: left; opacity: .55; font-weight: 600; padding-bottom: 10px; }
    td { padding: 9px 0; vertical-align: middle; }
    td.lab { font-size: 11px; opacity: .55; width: 74px; }
    img { display: block; }
    .zoom { image-rendering: pixelated; }
    .row-note { font-size: 11px; opacity: .5; padding-top: 6px; }
    .cell { display: flex; align-items: center; gap: 26px; }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="half">
      <h2>Light toolbar</h2>
      <table>
        <tr><th></th><th>As sent</th><th>Fixed</th><th>Shipped</th></tr>
        <tr><td class="lab">128 px</td>
          <td><img src="candidate-icon.png" width="128" height="128"></td><td><img src="candidate-icon-fixed.png" width="128" height="128"></td>
          <td><img src="../icons/icon128.png" width="128" height="128"></td></tr>
        <tr><td class="lab">48 px</td>
          <td><img src="candidate-icon.png" width="48" height="48"></td><td><img src="candidate-icon-fixed.png" width="48" height="48"></td>
          <td><img src="../icons/icon48.png" width="48" height="48"></td></tr>
        <tr><td class="lab">16 px<br>actual</td>
          <td><img src="candidate-icon.png" width="16" height="16"></td><td><img src="candidate-icon-fixed.png" width="16" height="16"></td>
          <td><img src="../icons/icon16.png" width="16" height="16"></td></tr>
        <tr><td class="lab">16 px<br>at 6x</td>
          <td><img class="zoom" src="candidate-icon.png" width="96" height="96"></td><td><img class="zoom" src="candidate-icon-fixed.png" width="96" height="96"></td>
          <td><img class="zoom" src="../icons/icon16.png" width="96" height="96"></td></tr>
      </table>
    </div>

    <div class="half dark">
      <h2>Dark toolbar</h2>
      <table>
        <tr><th></th><th>As sent</th><th>Fixed</th><th>Shipped</th></tr>
        <tr><td class="lab">128 px</td>
          <td><img src="candidate-icon.png" width="128" height="128"></td><td><img src="candidate-icon-fixed.png" width="128" height="128"></td>
          <td><img src="../icons/icon128.png" width="128" height="128"></td></tr>
        <tr><td class="lab">48 px</td>
          <td><img src="candidate-icon.png" width="48" height="48"></td><td><img src="candidate-icon-fixed.png" width="48" height="48"></td>
          <td><img src="../icons/icon48.png" width="48" height="48"></td></tr>
        <tr><td class="lab">16 px<br>actual</td>
          <td><img src="candidate-icon.png" width="16" height="16"></td><td><img src="candidate-icon-fixed.png" width="16" height="16"></td>
          <td><img src="../icons/icon16.png" width="16" height="16"></td></tr>
        <tr><td class="lab">16 px<br>at 6x</td>
          <td><img class="zoom" src="candidate-icon.png" width="96" height="96"></td><td><img class="zoom" src="candidate-icon-fixed.png" width="96" height="96"></td>
          <td><img class="zoom" src="../icons/icon16.png" width="96" height="96"></td></tr>
      </table>
    </div>
  </div>
</body>
</html>
